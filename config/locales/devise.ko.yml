# Additional translations at https://github.com/heartcombo/devise/wiki/I18n

ko:
  devise:
    confirmations:
      confirmed: 이메일 주소가 성공적으로 인증되었습니다.
      send_instructions: 몇 분 안에 이메일 주소 인증 방법이 담긴 메일을 받게 됩니다.
      send_paranoid_instructions: '이메일 주소가 데이터베이스에 있다면, 몇 분 안에 이메일 주소 인증 방법이 담긴 메일을 받게 됩니다.'
    failure:
      already_authenticated: 이미 로그인되어 있습니다.
      inactive: 계정이 아직 활성화되지 않았습니다.
      invalid: '%{authentication_keys} 또는 비밀번호가 올바르지 않습니다.'
      locked: 계정이 잠겨 있습니다.
      last_attempt: 한 번 더 실패하면 계정이 잠깁니다.
      not_found_in_database: '%{authentication_keys} 또는 비밀번호가 올바르지 않습니다.'
      timeout: 세션이 만료되었습니다. 계속하려면 다시 로그인해 주세요.
      unauthenticated: 계속하려면 로그인하거나 가입해야 합니다.
      unconfirmed: 계속하기 전에 이메일 주소를 인증해야 합니다.
      deleted: 계정이 삭제되었습니다.
    mailer:
      confirmation_instructions:
        subject: 이메일 인증 안내
      reset_password_instructions:
        subject: 비밀번호 재설정 안내
      unlock_instructions:
        subject: 잠금 해제 안내
      email_changed:
        subject: 이메일이 변경되었습니다
      password_change:
        subject: 비밀번호가 변경되었습니다
    omniauth_callbacks:
      failure: '"%{reason}" 때문에 %{kind}에서 인증하지 못했습니다.'
      success: '%{kind} 계정으로 인증되었습니다.'
    passwords:
      no_token: 비밀번호 재설정 메일의 링크 없이는 이 페이지에 접근할 수 없습니다. 재설정 메일에서 오셨다면 제공된 전체 URL을 사용했는지 확인해 주세요.
      send_instructions: 몇 분 안에 비밀번호 재설정 방법이 담긴 메일을 받게 됩니다.
      send_paranoid_instructions: '이메일 주소가 데이터베이스에 있다면, 몇 분 안에 비밀번호 복구 링크를 받게 됩니다.'
      updated: 비밀번호가 성공적으로 변경되었습니다. 지금 로그인되어 있습니다.
      updated_not_active: 비밀번호가 성공적으로 변경되었습니다.
    registrations:
      destroyed: '계정 삭제가 예약되었습니다. 안녕히 가세요!'
      cannot_delete: 다른 구성원이 있는 가족을 소유한 동안에는 계정을 삭제할 수 없습니다.
      signed_up: '환영합니다! 가입이 완료되었습니다.'
      signed_up_but_inactive: '가입은 완료되었지만, 계정이 아직 활성화되지 않아 로그인할 수 없습니다.'
      signed_up_but_locked: '가입은 완료되었지만, 계정이 잠겨 있어 로그인할 수 없습니다.'
      signed_up_but_unconfirmed: 확인 링크가 담긴 메시지가 이메일로 전송되었습니다. 링크를 따라가 계정을 활성화해 주세요.
      update_needs_confirmation: 계정은 업데이트되었지만 새 이메일 주소를 확인해야 합니다. 이메일을 확인하고 확인 링크를 따라가 주세요.
      updated: 계정이 성공적으로 업데이트되었습니다.
      updated_but_not_signed_in: 계정은 업데이트되었지만 비밀번호가 변경되어 다시 로그인해야 합니다.
    sessions:
      signed_in: 로그인되었습니다.
      signed_out: 로그아웃되었습니다.
      already_signed_out: 로그아웃되었습니다.
    unlocks:
      send_instructions: 몇 분 안에 계정 잠금 해제 방법이 담긴 메일을 받게 됩니다.
      send_paranoid_instructions: '계정이 존재한다면, 몇 분 안에 잠금 해제 방법이 담긴 메일을 받게 됩니다.'
      unlocked: 계정 잠금이 해제되었습니다. 계속하려면 로그인해 주세요.
  errors:
    messages:
      already_confirmed: 이미 확인되었습니다. 로그인해 보세요
      confirmation_period_expired: '%{period} 이내에 확인해야 합니다. 새로 요청해 주세요'
      expired: 만료되었습니다. 새로 요청해 주세요
      not_found: 찾을 수 없습니다
      not_locked: 잠겨 있지 않습니다
      not_saved:
        one: '%{resource}을(를) 저장하지 못한 오류가 1개 있습니다:'
        other: '%{resource}을(를) 저장하지 못한 오류가 %{count}개 있습니다:'
